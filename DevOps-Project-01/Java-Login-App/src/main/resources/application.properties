spring.mvc.view.prefix=/pages/
spring.mvc.view.suffix=.jsp

# Database connection. Values come from environment variables so no secrets
# are committed. Format: ${ENV_VAR:default}. Override at runtime, e.g.:
#   DB_URL=jdbc:mysql://<mysql-fqdn>:3306/UserDB DB_USERNAME=... DB_PASSWORD=...
spring.datasource.url = ${DB_URL:jdbc:mysql://localhost:3306/UserDB}
spring.datasource.username = ${DB_USERNAME:root}
spring.datasource.password = ${DB_PASSWORD:}
