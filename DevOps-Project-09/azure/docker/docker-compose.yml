version: '3.8'

networks:
  # Kết nối vào network hiện có của hệ thống cicd (nơi dp01-jenkins và dp01-sonarqube đang chạy)
  dp01-cicd:
    external: true

volumes:
  grafana_data:
  trivy_cache:

services:
  # GHI CHÚ: Jenkins (dp01-jenkins) và SonarQube (dp01-sonarqube) hiện ĐÃ CÓ SẴN và ĐANG CHẠY trên máy chủ.
  # Service sonar bên dưới được comment lại để tránh xung đột cổng 9000.
  # sonar:
  #   image: sonarqube:community
  #   container_name: dp01-sonarqube
  #   restart: unless-stopped
  #   ports:
  #     - "9000:9000"
  #   networks:
  #     - dp01-cicd

  # 1. DevSecOps Tools Container (Chứa sẵn Trivy, SonarScanner, Node, OWASP, Docker, Kubectl, Azure CLI)
  devsecops-tools:
    build:
      context: .
      dockerfile: Dockerfile.devops-tools
    image: devsecops-tools:latest
    container_name: devsecops-tools
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - trivy_cache:/root/.cache/trivy
    environment:
      - SONAR_HOST_URL=http://dp01-sonarqube:9000
    networks:
      - dp01-cicd

  # 2. Prometheus (Giám sát Jenkins và Host metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - dp01-cicd

  # 3. Grafana (Dashboard trực quan hóa)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - dp01-cicd

  # 4. Node Exporter (Thu thập metric phần cứng host)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - dp01-cicd
