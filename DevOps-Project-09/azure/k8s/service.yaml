apiVersion: v1
kind: Service
metadata:
  name: netflix-service
  labels:
    app: netflix
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "false"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: netflix
